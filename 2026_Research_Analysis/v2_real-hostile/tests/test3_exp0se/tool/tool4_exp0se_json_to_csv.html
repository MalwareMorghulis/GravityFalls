<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exp0se JSON to CSV Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9ff;
            --bg-tertiary: #f3f4f6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #e5e7eb;
            --border-hover: #667eea;
            --card-shadow: rgba(0,0,0,0.1);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }

        body.dark-mode {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-color: #2d3561;
            --border-hover: #667eea;
            --card-shadow: rgba(0,0,0,0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        }

        .container {
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: 0 20px 60px var(--card-shadow);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .header-content {
            flex: 1;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 28px;
            transition: color 0.3s ease;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .upload-section {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px 20px;
            margin-bottom: 25px;
            text-align: center;
            cursor: pointer;
            background: var(--bg-secondary);
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .upload-section.drag-over {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--gradient-start);
            transform: scale(1.01);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 14px;
            transition: color 0.3s ease;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        body.dark-mode .status.success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        body.dark-mode .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #fca5a5;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
            display: block;
        }

        body.dark-mode .status.info {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid #93c5fd;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn.show {
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }

        .btn-danger:active {
            transform: translateY(0);
        }

        .preview {
            display: none;
            margin-top: 25px;
        }

        .preview-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            font-size: 13px;
        }

        .preview-table thead {
            background: var(--bg-tertiary);
        }

        .preview-table th,
        .preview-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            word-break: break-word;
        }

        .preview-table th {
            font-weight: 600;
            color: var(--text-primary);
        }

        .preview-table tbody tr:hover {
            background: var(--bg-tertiary);
        }

        .preview-table tbody tr:last-child td {
            border-bottom: none;
        }

        .info-box {
            background: var(--bg-secondary);
            border-left: 4px solid var(--gradient-start);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .theme-toggle {
                width: 100%;
            }

            .toggle-label {
                flex: 1;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .preview-table {
                font-size: 12px;
            }

            .preview-table th,
            .preview-table td {
                padding: 8px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📊 exp0se JSON to CSV</h1>
                <div class="subtitle">Convert exp0se JSON to CSV with formatted headers</div>
            </div>
            <div class="theme-toggle">
                <label class="toggle-label">🌙 Dark</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="themeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="info-box">
            ℹ️ Upload a JSON file (newline-delimited or array format). CSV headers will be formatted as "exp0se (KEY)".
        </div>

        <div class="upload-section" id="uploadSection" onclick="document.getElementById('jsonFile').click()">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">JSON file</div>
            <input type="file" id="jsonFile" accept=".json,.txt">
        </div>

        <div id="status" class="status"></div>

        <div class="button-group" id="buttonGroup">
            <button class="btn btn-primary" id="exportBtn" onclick="downloadCSV()">
                📥 Export CSV
            </button>
            <button class="btn btn-danger" id="clearBtn" onclick="clearAll()">
                🔄 Clear All
            </button>
        </div>

        <div class="preview" id="preview">
            <div class="preview-title">Preview (first 10 rows)</div>
            <table class="preview-table">
                <thead id="previewHead"></thead>
                <tbody id="previewBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let jsonData = [];
        let csvData = null;
        let originalFileName = 'data';
        let allKeys = [];
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('jsonFile');
        const statusDiv = document.getElementById('status');
        const previewDiv = document.getElementById('preview');
        const previewHead = document.getElementById('previewHead');
        const previewBody = document.getElementById('previewBody');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Dark mode toggle
        themeToggle.addEventListener('change', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.checked = true;
        }

        // File input listeners
        fileInput.addEventListener('change', handleFile);

        // Drag and drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadSection.classList.add('drag-over');
        });

        uploadSection.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadSection.classList.remove('drag-over');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadSection.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(files[0]);
                fileInput.files = dataTransfer.files;
                const event = new Event('change', { bubbles: true });
                fileInput.dispatchEvent(event);
            }
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) {
                originalFileName = file.name.replace(/\.(json|txt)$/i, '');
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    try {
                        parseJSON(event.target.result);
                        extractKeys();
                        generatePreview();
                        generateCSV();
                        exportBtn.classList.add('show');
                        clearBtn.classList.add('show');
                        showStatus(`✓ JSON loaded successfully (${jsonData.length} records)`, 'success');
                    } catch (error) {
                        showStatus(`Error parsing JSON: ${error.message}`, 'error');
                        jsonData = [];
                    }
                };
                reader.readAsText(file);
            }
        }

        function parseJSON(content) {
            jsonData = [];
            
            // Brace counting approach to extract JSON objects
            let braceCount = 0;
            let currentObj = '';
            let inString = false;
            let escapeNext = false;
            
            for (let i = 0; i < content.length; i++) {
                const char = content[i];
                const prevChar = i > 0 ? content[i - 1] : '';
                
                // Handle string escaping
                if (escapeNext) {
                    currentObj += char;
                    escapeNext = false;
                    continue;
                }
                
                if (char === '\\' && inString) {
                    currentObj += char;
                    escapeNext = true;
                    continue;
                }
                
                // Track if we're inside a string
                if (char === '"' && prevChar !== '\\') {
                    inString = !inString;
                    currentObj += char;
                    continue;
                }
                
                // Only count braces outside of strings
                if (!inString) {
                    if (char === '{') {
                        braceCount++;
                        currentObj += char;
                    } else if (char === '}') {
                        braceCount--;
                        currentObj += char;
                        
                        // Object is complete
                        if (braceCount === 0 && currentObj.trim().length > 2) {
                            try {
                                const obj = JSON.parse(currentObj);
                                jsonData.push(obj);
                            } catch (e) {
                                console.log('Parse error:', e.message);
                            }
                            currentObj = '';
                        }
                    } else if (braceCount > 0) {
                        currentObj += char;
                    }
                } else {
                    currentObj += char;
                }
            }
            
            if (jsonData.length === 0) {
                throw new Error('No valid JSON objects found');
            }
        }

        function extractKeys() {
            const keySet = new Set();
            jsonData.forEach(obj => {
                Object.keys(obj).forEach(key => keySet.add(key));
            });
            allKeys = Array.from(keySet).sort();
        }

        function generatePreview() {
            previewHead.innerHTML = '';
            previewBody.innerHTML = '';

            // Create header
            const headerRow = document.createElement('tr');
            allKeys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = `exp0se (${key})`;
                headerRow.appendChild(th);
            });
            previewHead.appendChild(headerRow);

            // Create body rows (first 10)
            const previewCount = Math.min(10, jsonData.length);
            for (let i = 0; i < previewCount; i++) {
                const row = document.createElement('tr');
                const obj = jsonData[i];
                allKeys.forEach(key => {
                    const td = document.createElement('td');
                    let value = obj[key];
                    if (value === '' || value === undefined || value === null) {
                        td.textContent = 'N/A';
                    } else {
                        td.textContent = String(value);
                    }
                    row.appendChild(td);
                });
                previewBody.appendChild(row);
            }

            previewDiv.style.display = 'block';
        }

        function generateCSV() {
            let csv = '';
            
            // Add header
            csv += allKeys.map(key => escapeCSV(`exp0se (${key})`)).join(',') + '\n';
            
            // Add data rows
            jsonData.forEach(obj => {
                const row = allKeys.map(key => {
                    let value = obj[key];
                    if (value === '' || value === undefined || value === null) {
                        return escapeCSV('N/A');
                    }
                    return escapeCSV(String(value));
                });
                csv += row.join(',') + '\n';
            });
            
            csvData = csv;
        }

        function escapeCSV(value) {
            if (value === null || value === undefined) return '';
            
            const stringValue = String(value);
            
            if (stringValue.includes(',') || stringValue.includes('"') || stringValue.includes('\n')) {
                return `"${stringValue.replace(/"/g, '""')}"`;
            }
            
            return stringValue;
        }

        function downloadCSV() {
            if (!csvData || jsonData.length === 0) {
                showStatus('No data to export', 'error');
                return;
            }

            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${originalFileName}_transp0se.csv`;
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus('✓ CSV downloaded successfully', 'success');
        }

        function clearAll() {
            jsonData = [];
            csvData = null;
            allKeys = [];
            originalFileName = 'data';
            
            fileInput.value = '';
            previewHead.innerHTML = '';
            previewBody.innerHTML = '';
            previewDiv.style.display = 'none';
            
            exportBtn.classList.remove('show');
            clearBtn.classList.remove('show');
            
            showStatus('✓ All cleared', 'success');
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
