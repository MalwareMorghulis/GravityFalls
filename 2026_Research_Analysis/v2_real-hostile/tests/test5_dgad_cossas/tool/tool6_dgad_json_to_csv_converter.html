<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to CSV Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9ff;
            --bg-tertiary: #f3f4f6;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #e5e7eb;
            --border-hover: #667eea;
            --card-shadow: rgba(0,0,0,0.1);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }

        body.dark-mode {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-color: #2d3561;
            --border-hover: #667eea;
            --card-shadow: rgba(0,0,0,0.5);
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
        }

        .container {
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: 0 20px 60px var(--card-shadow);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .header-content {
            flex: 1;
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 28px;
            transition: color 0.3s ease;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
            white-space: nowrap;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            margin-bottom: 30px;
        }

        .upload-area:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .upload-area.drag-over {
            background: rgba(102, 126, 234, 0.1);
            border-color: var(--gradient-start);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 14px;
            transition: color 0.3s ease;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        body.dark-mode .status.success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid #6ee7b7;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        body.dark-mode .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #fca5a5;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
            display: block;
        }

        body.dark-mode .status.info {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid #93c5fd;
        }

        .preview {
            margin: 25px 0;
            display: none;
        }

        .preview-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .json-preview {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .controls {
            margin: 25px 0;
            display: none;
            gap: 15px;
            flex-wrap: wrap;
        }

        .controls.show {
            display: flex;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .checkbox-item label {
            cursor: pointer;
            color: var(--text-primary);
            font-size: 14px;
            transition: color 0.3s ease;
            margin: 0;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn.show {
            display: block;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .theme-toggle {
                width: 100%;
            }

            .toggle-label {
                flex: 1;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>📊 JSON to CSV Converter</h1>
                <div class="subtitle">Convert JSON files to CSV format instantly</div>
            </div>
            <div class="theme-toggle">
                <label class="toggle-label">🌙 Dark</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="themeToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('jsonFile').click()">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">JSON file</div>
            <input type="file" id="jsonFile" accept=".json">
        </div>

        <div id="status" class="status"></div>

        <div class="preview" id="preview">
            <div class="preview-title">JSON Preview</div>
            <div class="json-preview" id="jsonPreview"></div>
        </div>

        <div class="controls" id="controls">
            <div class="preview-title">Select columns to include:</div>
            <div class="checkbox-group" id="columnCheckboxes"></div>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadCSV()">
            📥 Download CSV
        </button>
    </div>

    <script>
        let jsonData = null;
        let csvData = null;
        let columns = [];
        let originalFileName = 'data';
        
        // Column name mapping for display titles (hierarchical columns are auto-generated)
        const columnTitleMap = {
            'DGAD: raw': 'DGAD: input (raw)',
            'DGAD: suffix': 'DGAD: tld (suffix)',
            'DGAD: is_dga': 'DGAD: overall flag (is_dga)',
            'DGAD: family_label': 'DGAD: overall label (family_label)',
            'DGAD: padded_length': 'DGAD: max overall length (padded_length)'
        };
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('jsonFile');
        const statusDiv = document.getElementById('status');
        const previewDiv = document.getElementById('preview');
        const jsonPreviewDiv = document.getElementById('jsonPreview');
        const controlsDiv = document.getElementById('controls');
        const downloadBtn = document.getElementById('downloadBtn');
        const columnCheckboxesDiv = document.getElementById('columnCheckboxes');

        // Dark mode toggle
        themeToggle.addEventListener('change', () => {
            body.classList.toggle('dark-mode');
            localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        });

        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.checked = true;
        }

        // File input listeners
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(files[0]);
                fileInput.files = dataTransfer.files;
                const event = new Event('change', { bubbles: true });
                fileInput.dispatchEvent(event);
            }
        });

        function handleFile(e) {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        }

        function processFile(file) {
            showStatus('Processing file...', 'info');
            
            // Capture original filename and strip .json extension
            originalFileName = file.name.replace(/\.json$/i, '');
            
            const reader = new FileReader();
            
            reader.onload = function(event) {
                try {
                    jsonData = JSON.parse(event.target.result);
                    displayJSON();
                    extractColumns();
                    generateCSV();
                    showStatus('✓ JSON file loaded successfully', 'success');
                } catch (error) {
                    showStatus(`Error parsing JSON: ${error.message}`, 'error');
                    jsonData = null;
                }
            };

            reader.onerror = function() {
                showStatus('Error reading file', 'error');
            };

            reader.readAsText(file);
        }

        function displayJSON() {
            let displayData;
            
            if (Array.isArray(jsonData) && jsonData.length > 0) {
                // Show first entry as expanded single row
                const firstItem = jsonData[0];
                const expandedRow = flattenRow(firstItem, []);
                displayData = expandedRow[0];
            } else if (typeof jsonData === 'object') {
                const expandedRow = flattenRow(jsonData, []);
                displayData = expandedRow[0];
            } else {
                displayData = jsonData;
            }
            
            const preview = JSON.stringify(displayData, null, 2);
            jsonPreviewDiv.textContent = preview.length > 500 ? preview.substring(0, 500) + '...' : preview;
            previewDiv.style.display = 'block';
        }

        function extractColumns() {
            columns = [];
            
            // Find the maximum number of words to determine hierarchical levels
            let maxWords = 0;
            if (Array.isArray(jsonData)) {
                jsonData.forEach(item => {
                    if (Array.isArray(item.words)) {
                        maxWords = Math.max(maxWords, item.words.length);
                    }
                });
            } else if (typeof jsonData === 'object' && Array.isArray(jsonData.words)) {
                maxWords = jsonData.words.length;
            }
            
            // Create hierarchical labels
            const wordLabels = ['domain'];
            for (let i = 1; i < maxWords; i++) {
                wordLabels.push(`subdomain${i}`);
            }
            
            // Add non-words properties
            columns.push('DGAD: input (raw)');
            columns.push('DGAD: tld (suffix)');
            columns.push('DGAD: overall flag (is_dga)');
            columns.push('DGAD: overall label (family_label)');
            columns.push('DGAD: max overall length (padded_length)');
            
            // Add word level properties for each hierarchical level
            wordLabels.forEach(label => {
                columns.push(`DGAD: ${label}.value`);
                columns.push(`DGAD: ${label}.padded_length`);
                columns.push(`DGAD: ${label}.binary_score`);
                columns.push(`DGAD: ${label}.binary_label`);
                columns.push(`DGAD: ${label}.family_score`);
                columns.push(`DGAD: ${label}.family_label`);
            });

            renderColumnCheckboxes();
        }

        function flattenObject(obj, prefix = '') {
            let result = {};
            
            for (let key in obj) {
                if (obj.hasOwnProperty(key) && key.toLowerCase() !== 'words') {
                    const newKey = prefix ? `${prefix}.${key}` : key;
                    
                    if (obj[key] !== null && typeof obj[key] === 'object' && !Array.isArray(obj[key])) {
                        result = { ...result, ...flattenObject(obj[key], newKey) };
                    } else if (Array.isArray(obj[key])) {
                        result[newKey] = JSON.stringify(obj[key]);
                    } else {
                        result[newKey] = obj[key];
                    }
                }
            }
            
            return result;
        }

        function flattenRow(obj, selectedColumns) {
            // Create one row per entry (not per word)
            const baseFlat = {};
            
            // Add non-words properties with mapped names
            baseFlat['DGAD: input (raw)'] = obj.raw || '';
            baseFlat['DGAD: tld (suffix)'] = obj.suffix || '';
            baseFlat['DGAD: overall flag (is_dga)'] = obj.is_dga !== undefined ? obj.is_dga : '';
            baseFlat['DGAD: overall label (family_label)'] = obj.family_label || '';
            baseFlat['DGAD: max overall length (padded_length)'] = obj.padded_length || '';
            
            // Create hierarchical labels
            const wordLabels = ['domain'];
            if (Array.isArray(obj.words)) {
                for (let i = 1; i < obj.words.length; i++) {
                    wordLabels.push(`subdomain${i}`);
                }
            }
            
            // Add word properties for each hierarchical level
            if (Array.isArray(obj.words)) {
                obj.words.forEach((wordObj, index) => {
                    if (index < wordLabels.length && typeof wordObj === 'object') {
                        const label = wordLabels[index];
                        baseFlat[`DGAD: ${label}.value`] = wordObj.value || '';
                        baseFlat[`DGAD: ${label}.padded_length`] = wordObj.padded_length || '';
                        baseFlat[`DGAD: ${label}.binary_score`] = wordObj.binary_score !== undefined ? wordObj.binary_score : '';
                        baseFlat[`DGAD: ${label}.binary_label`] = wordObj.binary_label || '';
                        baseFlat[`DGAD: ${label}.family_score`] = wordObj.family_score !== undefined ? wordObj.family_score : '';
                        baseFlat[`DGAD: ${label}.family_label`] = wordObj.family_label || '';
                    }
                });
            }
            
            return [baseFlat];
        }

        function renderColumnCheckboxes() {
            columnCheckboxesDiv.innerHTML = '';
            
            columns.forEach(col => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `col_${col}`;
                checkbox.value = col;
                checkbox.checked = true;
                
                const label = document.createElement('label');
                label.htmlFor = `col_${col}`;
                label.textContent = columnTitleMap[col] || col;
                
                div.appendChild(checkbox);
                div.appendChild(label);
                columnCheckboxesDiv.appendChild(div);
            });

            controlsDiv.classList.add('show');
        }

        function getSelectedColumns() {
            const checkboxes = columnCheckboxesDiv.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function generateCSV() {
            const selectedColumns = getSelectedColumns();
            if (selectedColumns.length === 0) {
                showStatus('Please select at least one column', 'error');
                return;
            }

            let csv = '';
            
            // Add header with mapped titles
            csv += selectedColumns.map(col => escapeCSV(columnTitleMap[col] || col)).join(',') + '\n';

            // Add data rows
            if (Array.isArray(jsonData)) {
                jsonData.forEach(item => {
                    const expandedRow = flattenRow(item, selectedColumns);
                    const rowObj = expandedRow[0];
                    const row = selectedColumns.map(col => {
                        return escapeCSV(rowObj[col] ?? '');
                    });
                    csv += row.join(',') + '\n';
                });
            } else if (typeof jsonData === 'object') {
                const expandedRow = flattenRow(jsonData, selectedColumns);
                const rowObj = expandedRow[0];
                const row = selectedColumns.map(col => {
                    return escapeCSV(rowObj[col] ?? '');
                });
                csv += row.join(',') + '\n';
            }

            csvData = csv;
            downloadBtn.classList.add('show');
        }

        function escapeCSV(value) {
            if (value === null || value === undefined) return '';
            
            const stringValue = String(value);
            
            if (stringValue.includes(',') || stringValue.includes('"') || stringValue.includes('\n')) {
                return `"${stringValue.replace(/"/g, '""')}"`;
            }
            
            return stringValue;
        }

        function downloadCSV() {
            if (!csvData) {
                showStatus('No CSV data to download', 'error');
                return;
            }

            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${originalFileName}_converted.csv`;
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showStatus('✓ CSV downloaded successfully', 'success');
        }

        // Update CSV when column selection changes
        columnCheckboxesDiv.addEventListener('change', generateCSV);

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
